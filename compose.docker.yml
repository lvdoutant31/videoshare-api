name: yingliu-docker

services:
  app:
    image: yingliu-api:local
    build:
      context: ./yingliu-admin/target
      dockerfile: ../../docker/app/Dockerfile.runtime
    env_file:
      - .env
      - .env.docker
    environment:
      SPRING_PROFILES_ACTIVE: local
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      REDIS_HOST: host.docker.internal
      REDIS_PORT: ${REDIS_PORT:-6379}
      APP_PORT: 8080
      MEDIA_ROOT: /data/media
      MEDIA_STORAGE_TYPE: local
      MEDIA_LOCAL_URL_PREFIX: /media
      FLYWAY_ENABLED: "true"
      VIDEO_TRANSCODE_ENABLED: "true"
      FFMPEG_PATH: /usr/bin/ffmpeg
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - ./document/media:/data/media
      - ./output/logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  web:
    image: nginx:stable-alpine3.20-perl
    ports:
      - "3000:80"
      - "5173:80"
      - "8088:80"
    volumes:
      - ../yingliu-b/dist:/srv/admin:ro
      - ../yingliu-c/dist:/srv/h5:ro
      - ./document/media:/srv/media:ro
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/videoshare/h5/"]
      interval: 10s
      timeout: 5s
      retries: 6
