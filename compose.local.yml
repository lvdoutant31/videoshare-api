name: yingliu-local

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in ticktok-api/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yingliu-db}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - local-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - local-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_PORT: 8080
      MEDIA_ROOT: /workspace/document/media
      MEDIA_LOCAL_URL_PREFIX: /media
    ports:
      - "8080:8080"
    volumes:
      - ./document/media:/workspace/document/media
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  media:
    image: nginx:stable-alpine3.20-perl
    ports:
      - "8088:80"
    volumes:
      - ./document/media:/srv/media:ro
      - ./docker/nginx/media.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  admin:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      VITE_PROXY_TARGET: http://app:8080
      VITE_MEDIA_PROXY_TARGET: http://media
      VITE_API_ENCRYPTION_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - ../yingliu-b:/workspace
      - admin-node-modules:/workspace/node_modules
    depends_on:
      - app
      - media

  h5:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_PROXY_TARGET: http://app:8080
      VITE_MEDIA_PROXY_TARGET: http://media
    ports:
      - "5173:5173"
    volumes:
      - ../yingliu-c:/workspace
      - h5-node-modules:/workspace/node_modules
    depends_on:
      - app
      - media

volumes:
  local-mysql-data:
  local-redis-data:
  admin-node-modules:
  h5-node-modules:
