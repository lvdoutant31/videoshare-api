spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:yingliu-db}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
server:
  port: ${APP_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
