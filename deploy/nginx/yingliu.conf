# Yingliu independent frontend and API gateway.
# Public prefix: https://www.ysd-hsdy.com.cn/videoshare
# Install as: F:/nginx-1.23.4/conf/conf.d/yingliu.conf

server {
    listen 8092 ssl;
    server_name www.ysd-hsdy.com.cn 10.2.0.23 localhost;

    # Both LAN and WAN clients enter through HTTPS 443, which is forwarded to
    # this internal 8092 listener. Keep redirects relative so Nginx never leaks
    # the internal port into the public Location header.
    absolute_redirect off;

    ssl_certificate F:/nginx-1.23.4/ssl/www.ysd-hsdy.com.cn.pem;
    ssl_certificate_key F:/nginx-1.23.4/ssl/www.ysd-hsdy.com.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:YingliuSSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    client_max_body_size 500m;
    client_body_timeout 600s;

    # Keep the connectivity test available through its explicit URL.
    location = /domain-test.html {
        alias F:/videoshare/frontend/domain-test.html;
        default_type text/html;
        charset utf-8;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Yingliu-Endpoint "domain-test" always;
    }

    location = /videoshare/h5 {
        return 301 /videoshare/h5/;
    }

    location = /videoshare/h5/ {
        rewrite ^ /_yingliu_h5_index last;
    }

    location = /videoshare/admin {
        return 301 /videoshare/admin/;
    }

    location = /videoshare/admin/ {
        rewrite ^ /_yingliu_admin_index last;
    }

    location = /WW_verify_gP37bghLu4rMiDTm.txt {
    alias F:/videoshare/oauth/WW_verify_gP37bghLu4rMiDTm.txt;
    default_type text/plain;
    charset utf-8;

    # 企业微信验证文件不应被浏览器或代理长期缓存。
    add_header Cache-Control "no-store" always;

    # 仅允许读取和探测。
    limit_except GET HEAD {
        deny all;
    }
}	

    # Public mobile frontend. Strip only the external /videoshare prefix before
    # resolving files under F:/videoshare/frontend.
    location /videoshare/h5/ {
        rewrite ^/videoshare(/h5/.*)$ $1 break;
        root F:/videoshare/frontend;
        try_files $uri $uri/ /_yingliu_h5_index;
    }

    location = /_yingliu_h5_index {
        internal;
        alias F:/videoshare/frontend/h5/index.html;
        default_type text/html;
        charset utf-8;
    }

    # Public admin frontend.
    location /videoshare/admin/ {
        rewrite ^/videoshare(/admin/.*)$ $1 break;
        root F:/videoshare/frontend;
        try_files $uri $uri/ /_yingliu_admin_index;
    }

    location = /_yingliu_admin_index {
        internal;
        alias F:/videoshare/frontend/admin/index.html;
        default_type text/html;
        charset utf-8;
    }

    location ~* ^/videoshare/(h5|admin)/.*\.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff|woff2|ttf|eot)$ {
        rewrite ^/videoshare(/.*)$ $1 break;
        root F:/videoshare/frontend;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Public API. Spring Boot owns the /videoshare servlet context, so preserve
    # the complete request URI when proxying.
    location /videoshare/api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;

        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # TLS is terminated by the public gateway before this port.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_cookie_flags yingliu-admin-session httponly secure samesite=lax;
    }

    location = /videoshare/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Public uploaded files.
    location /videoshare/media/ {
        alias F:/videoshare/media/;
        autoindex off;
        add_header Accept-Ranges bytes;
    }

    # Canonicalize legacy frontend paths. The public URL must always contain
    # the /videoshare service context.
    location = /h5 {
        return 301 /videoshare/h5/;
    }

    location = /admin {
        return 301 /videoshare/admin/;
    }

    location /h5/ {
        return 301 /videoshare$request_uri;
    }

    location /admin/ {
        return 301 /videoshare$request_uri;
    }

    # Preserve HTTP methods while redirecting legacy API calls.
    location /api/ {
        return 308 /videoshare$request_uri;
    }

    location = /health {
        return 301 /videoshare/health;
    }

    location /media/ {
        return 301 /videoshare$request_uri;
    }

    # Redirect the root path and every route not configured above to the
    # corporate website. Use 302 so the fallback can be changed without a
    # permanent redirect being cached by clients.
    location / {
        return 302 https://www.ysd-hd.com/;
    }
}
