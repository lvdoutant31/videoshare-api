server {
    listen 80;
    listen [::]:80;
    server_name _;
    client_max_body_size 500m;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location = / { return 302 /videoshare/h5/; }
    location = /videoshare/admin { return 302 /videoshare/admin/; }
    location = /videoshare/h5 { return 302 /videoshare/h5/; }

    location /videoshare/admin/ {
        alias /srv/admin/;
        try_files $uri $uri/ /videoshare/admin/index.html;
        add_header Cache-Control "no-cache" always;
    }
    location ^~ /videoshare/admin/assets/ {
        alias /srv/admin/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /videoshare/h5/ {
        alias /srv/h5/;
        try_files $uri $uri/ /videoshare/h5/index.html;
        add_header Cache-Control "no-cache" always;
    }
    location ^~ /videoshare/h5/assets/ {
        alias /srv/h5/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /videoshare/api/ {
        proxy_pass http://app:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location /api/ {
        proxy_pass http://app:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location = /health { proxy_pass http://app:8080/health; }
    location = /videoshare/health { proxy_pass http://app:8080/health; }
    location /media/ {
        alias /srv/media/;
        autoindex off;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        limit_except GET OPTIONS { deny all; }
    }
    location /videoshare/media/ {
        alias /srv/media/;
        autoindex off;
        add_header Accept-Ranges bytes always;
        limit_except GET OPTIONS { deny all; }
    }
}
