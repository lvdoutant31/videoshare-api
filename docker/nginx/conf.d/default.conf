server {
    listen 80;
    server_name _;
    client_max_body_size 2g;

    location = / { return 302 /h5/; }
    location /h5/ { alias /usr/share/nginx/html/h5/; try_files $uri $uri/ /h5/index.html; }
    location /admin/ { alias /usr/share/nginx/html/admin/; try_files $uri $uri/ /admin/index.html; }
    location /api/ { proxy_pass http://app:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /health { proxy_pass http://app:8080/health; }
    location /actuator/ { return 404; }
    location /media/internal/ { internal; alias /media/; }
}
